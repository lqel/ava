    <style>
        /* ============================================================
           ONE RAIL — 同轴装置
           全站只有一台机器：一根轴 + 挂在同一根轴上的滑块。
           所有文字（LOGO / 邮箱 / Limited / 四字）都是同一种「滑块」，
           由同一个主循环写位移、字距、显隐与逐字磁场，不存在各自计时。
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Hiragino Sans GB", sans-serif;
            font-weight: 300;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        :root {
            --bg: #F3EEE3;
            --soft: #6B6156;
            --ink: #2A2724;
            --accent: #D9541E;
            --hair: rgba(42, 39, 36, 0.16);
            --grid: rgba(42, 39, 36, 0.035);
            --slash: rgba(42, 39, 36, 0.065);
            --glow: rgba(217, 84, 30, 0.055);
            --spread: 0;
            --close: 0;
            --late: 0;
            --intro: 0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1C1A18;
                --soft: #A79C8E;
                --ink: #D8CBB3;
                --accent: #E0703C;
                --hair: rgba(167, 156, 142, 0.18);
                --grid: rgba(167, 156, 142, 0.04);
                --slash: rgba(167, 156, 142, 0.08);
                --glow: rgba(224, 112, 60, 0.06);
            }
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            opacity: 0;
        }

        #frame {
            position: fixed;
            inset: 0;
            overflow: hidden;
        }

        /* 极淡网格：只随收束平移一格，不闪不变色 */
        .grid {
            position: absolute;
            inset: -80px;
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 64px 64px;
            background-position:
                calc(var(--close) * 10px) calc(var(--close) * 6px);
            pointer-events: none;
        }

        #glow {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 52vmax;
            height: 52vmax;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow) 0%, transparent 68%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* 装置本体：整块只做鼠标视差，内部所有部件同拍 */
        #rig {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(1120px, 88vw);
            height: min(560px, 68vh);
            transform: translate3d(
                calc(-50% + var(--parx, 0px)),
                calc(-50% + var(--pary, 0px)), 0);
            will-change: transform;
        }

        .rail {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent 0%, var(--hair) 6%, var(--hair) 94%, transparent 100%);
            transform-origin: 50% 50%;
        }

        .tick {
            position: absolute;
            top: -3px;
            width: 1px;
            height: 7px;
            background: var(--hair);
            opacity: 0.45;
            transform: translateX(-50%);
        }

        .tick.major {
            top: -6px;
            height: 13px;
        }

        /* 扫描头：一根极细的焦橙竖线，沿轴走一遍 */
        .head {
            position: absolute;
            top: -11px;
            left: 0;
            width: 1px;
            height: 23px;
            background: var(--accent);
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
        }

        /* 点击脉冲：沿轴展开的一条细亮线 */
        .pulse {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            transform: scaleX(var(--pw, 0));
            opacity: var(--po, 0);
            pointer-events: none;
        }

        /* 中央斜杠：装置的指针，不参与文字排版，但与全场同拍推拉 */
        .axis-slash {
            position: absolute;
            left: 50%;
            top: 50%;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            font-size: clamp(180px, 34vw, 420px);
            line-height: 1;
            color: var(--slash);
            clip-path: inset(14% 0 14% 0);
            opacity: 0;
            white-space: nowrap;
            pointer-events: none;
            transform: translate3d(
                calc(-50% + var(--sx, 0px)),
                calc(-50% + var(--sy, 0px)), 0)
                rotate(var(--rot, 0deg));
            will-change: transform;
        }

        /* ===== 滑块：所有文字共用同一条 transform ===== */
        .unit {
            position: absolute;
            white-space: nowrap;
            color: var(--soft);
            pointer-events: none;
            /* 默认不可见，由主循环统一给显隐，避免开场闪出未就位的文字 */
            opacity: var(--o, 0);
            transform: translate3d(
                calc(var(--bx, 0px) + var(--ux, 0px)),
                calc(var(--by, 0px) + var(--uy, 0px)), 0);
            will-change: transform;
        }

        .unit .g {
            display: inline-block;
            opacity: var(--ga, 1);
            will-change: transform, opacity;
        }

        .unit .g.is-slash {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        /* 空格单独做成宽距，让 Anthvia Limited 的间隔看得出来 */
        .unit .gap {
            display: inline-block;
            width: 1.25em;
        }

        .hero {
            left: 50%;
            top: 36%;
            --bx: -50%;
            --by: -50%;
            font-size: clamp(34px, 6.6vw, 88px);
            line-height: 1;
            letter-spacing: calc(.28em + var(--spread) * .10em);
        }

        /* 抵消末字符后多出的一份字距，让 LOGO 的视觉中心真正落在轴上 */
        .hero .g:last-child {
            margin-right: calc(-.28em - var(--spread) * .10em);
        }

        .pair {
            top: calc(50% + 44px);
            font-size: clamp(10px, 1.06vw, 13px);
            line-height: 1.4;
            letter-spacing: calc(.20em + var(--spread) * .07em);
        }

        .legal { left: 0; }
        .mail  { right: 0; }

        /* 四字挂在轴的刻度上：位置与朝向随机但固定，出现后不飞不闪 */
        .mark {
            left: var(--ml, 50%);
            top: calc(50% + var(--mt, 0px));
            --bx: -50%;
            --by: -50%;
            font-size: clamp(15px, 2vw, 26px);
            letter-spacing: 0;
            transform: translate3d(
                calc(var(--bx, 0px) + var(--ux, 0px)),
                calc(var(--by, 0px) + var(--uy, 0px)), 0)
                rotate(var(--turn, 0deg));
        }

        @media (max-width: 700px) {
            #rig { height: min(520px, 72vh); }
            .hero { top: 32%; }
            .axis-slash { font-size: clamp(150px, 52vw, 260px); }
            .legal { top: calc(50% + 46px); }
            .mail { top: calc(50% + 76px); right: auto; left: 0; }
            .pair { letter-spacing: calc(.14em + var(--spread) * .05em); }
            .mark { font-size: clamp(14px, 4vw, 20px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .grid { background-image: none; }
            #glow { display: none; }
            .head, .pulse { display: none; }
        }

        @media (hover: none), (pointer: coarse) {
            #glow { display: none; }
        }
    </style>
</head>
<body>
    <h1 class="sr">Anthvia · 一点星尘</h1>

    <div id="frame">
        <div class="grid" aria-hidden="true"></div>

        <div id="rig">
            <div class="axis-slash" id="slash" aria-hidden="true">/</div>

            <div class="rail" id="rail" aria-hidden="true">
                <b class="head" id="scanHead"></b>
            </div>
            <div class="pulse" id="pulse" aria-hidden="true"></div>

            <div class="unit hero"  id="uHero"  data-lane="-1" data-pos="0.50"></div>
            <div class="unit pair legal" id="uLegal" data-lane="2"  data-pos="0.22"></div>
            <div class="unit pair mail"  id="uMail"  data-lane="-2" data-pos="0.80"></div>
        </div>

        <div id="glow" aria-hidden="true"></div>
    </div>

    <script>
    (function () {
        "use strict";

        /* ---------- 禁止选中 / 复制 / 缩放（缩放由 viewport 控制） ---------- */
        const blockCtx = (e) => e.preventDefault();
        const blockCopy = (e) => {
            e.preventDefault();
            if (e.clipboardData) e.clipboardData.setData("text/plain", "");
        };
        document.addEventListener("contextmenu", blockCtx);
        document.addEventListener("selectstart", blockCtx);
        document.addEventListener("copy", blockCopy);
        document.addEventListener("cut", blockCopy);
        document.addEventListener("dragstart", blockCtx);
        window.addEventListener("keydown", (e) => {
            if (!(e.ctrlKey || e.metaKey)) return;
            const k = e.key.toLowerCase();
            if (k === "c" || k === "x" || k === "a") e.preventDefault();
        });

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const precise = window.matchMedia("(hover: hover)").matches;

        const root = document.documentElement;
        const rig = document.getElementById("rig");
        const rail = document.getElementById("rail");
        const scanHead = document.getElementById("scanHead");
        const pulse = document.getElementById("pulse");
        const slash = document.getElementById("slash");
        const glow = document.getElementById("glow");

        /* ---------- 轴上刻度 ---------- */
        const TICKS = 16;
        const ticks = [];
        for (let i = 0; i <= TICKS; i++) {
            const t = document.createElement("i");
            t.className = "tick" + (i % 4 === 0 ? " major" : "");
            t.style.left = (i / TICKS * 100) + "%";
            rail.insertBefore(t, scanHead);
            ticks.push(t);
        }

        /* ---------- 把文字拆成逐字滑块 ----------
           LOGO、邮箱、Limited、四字全部进同一个 glyphs 数组，
           共用同一套磁场、同一套缓动、同一套加深逻辑。            */
        const glyphs = [];

        function makeUnit(el, text, base, late, lane, pos) {
            const u = {
                el, base, late, lane, pos,
                ux: 0, uy: 0, visible: !late, o: late ? 0 : 1
            };
            for (const ch of text) {
                if (ch === " ") {
                    const gap = document.createElement("span");
                    gap.className = "gap";
                    el.appendChild(gap);
                    continue;
                }
                const s = document.createElement("span");
                s.className = "g" + (ch === "/" ? " is-slash" : "");
                s.textContent = ch;
                s.style.setProperty("--ga", String(base));
                el.appendChild(s);
                glyphs.push({
                    el: s, unit: u, base,
                    cx: 0, cy: 0, x: 0, y: 0, r: 0, d: 0,
                    lx: 0, ly: 0, lr: 0, ld: 0
                });
            }
            return u;
        }

        const units = [];
        units.push(makeUnit(document.getElementById("uHero"),  "ANTHV/A",            0.92, false, -1, 0.50));
        units.push(makeUnit(document.getElementById("uLegal"), "Anthvia Limited",   0.78, true,   2, 0.22));
        units.push(makeUnit(document.getElementById("uMail"),  "contact@anthvia.com", 0.78, false, -2, 0.80));

        /* 四字：随机刻度位置 + 随机朝向，静态出现，无飞入 */
        const cnText = "一点星尘";
        const bands = [[8, 28], [30, 48], [52, 70], [72, 92]];
        for (let i = 0; i < cnText.length; i++) {
            const el = document.createElement("div");
            el.className = "unit mark";
            const ml = bands[i][0] + Math.random() * (bands[i][1] - bands[i][0]);
            const mt = (i % 2 === 0 ? -1 : 1) * (30 + Math.random() * 62);
            el.style.setProperty("--ml", ml.toFixed(2) + "%");
            el.style.setProperty("--mt", mt.toFixed(1) + "px");
            el.style.setProperty("--turn", (Math.random() * 30 - 15).toFixed(1) + "deg");
            el.dataset.lane = (i % 2 === 0 ? 1 : -1);
            el.dataset.pos = (ml / 100).toFixed(3);
            el.setAttribute("aria-hidden", "true");
            rig.appendChild(el);
            units.push(makeUnit(el, cnText[i], 0.16, true,
                Number(el.dataset.lane), Number(el.dataset.pos)));
        }

        /* ---------- 坐标缓存：只测一次，之后用当前位移推算 ---------- */
        let parx = 0, pary = 0;
        function measure() {
            for (const g of glyphs) {
                const r = g.el.getBoundingClientRect();
                g.cx = r.left + r.width / 2 - g.unit.ux - parx;
                g.cy = r.top + r.height / 2 - g.unit.uy - pary;
            }
        }

        /* ---------- 指针：鼠标与触屏共用同一坐标状态 ---------- */
        let px = -9999, py = -9999, onPoint = false;
        let tparx = 0, tpary = 0;

        function setPoint(x, y) {
            px = x; py = y; onPoint = true;
            tparx = (x / window.innerWidth - 0.5) * 20;
            tpary = (y / window.innerHeight - 0.5) * 14;
            if (precise) {
                glow.style.left = x + "px";
                glow.style.top = y + "px";
                glow.style.opacity = "1";
            }
        }
        function clearPoint() {
            onPoint = false;
            px = py = -9999;
            tparx = tpary = 0;
            if (precise) glow.style.opacity = "0";
        }

        document.addEventListener("pointermove", (e) => {
            if (e.pointerType === "touch") return;
            setPoint(e.clientX, e.clientY);
        }, { passive: true });
        document.addEventListener("touchstart", (e) => {
            const t = e.touches[0]; if (t) setPoint(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener("touchmove", (e) => {
            const t = e.touches[0]; if (t) setPoint(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener("touchend", clearPoint, { passive: true });
        document.addEventListener("touchcancel", clearPoint, { passive: true });
        document.addEventListener("mouseleave", clearPoint);
        window.addEventListener("blur", clearPoint);
        window.addEventListener("resize", () => { measure(); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

        /* ---------- 唯一主时钟 ----------
           一轮 7.6s：收束 → 错位对拉 → 沿 70° 推出 → 归位静止。
           点击会从 0 重新起一轮，等于手动触发一次完整机械动作。 */
        const BEAT = 7600;
        const start = performance.now();
        let beat0 = start;
        let clickAt = -9999;

        document.addEventListener("pointerdown", () => {
            beat0 = performance.now();
            clickAt = beat0;
        }, { passive: true });

        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const ease = (t) => t * t * (3 - 2 * t);
        const wave = (p, s, e) => (p <= s || p >= e) ? 0 : Math.sin(Math.PI * (p - s) / (e - s));

        /* 减少动效：直接给静态排版，不启动循环 */
        if (reduceMotion) {
            root.style.setProperty("--intro", "1");
            root.style.setProperty("--late", "1");
            root.style.setProperty("--spread", "0");
            for (const u of units) {
                u.el.style.setProperty("--ux", "0px");
                u.el.style.setProperty("--uy", "0px");
                u.el.style.setProperty("--o", "1");
                u.visible = true;
            }
            for (const g of glyphs) {
                g.el.style.setProperty("--ga", String(g.base));
            }
            for (const t of ticks) t.style.opacity = "0.45";
            slash.style.opacity = "0.9";
            measure();
            return;
        }

        measure();
        setTimeout(measure, 5200);

        function frame(now) {
            const elapsed = now - start;
            const intro = ease(clamp(elapsed / 1400, 0, 1));
            const late = ease(clamp((elapsed - 5000) / 1200, 0, 1));
            const p = ((now - beat0) % BEAT) / BEAT;

            const close = wave(p, 0.03, 0.27);
            const shear = wave(p, 0.25, 0.53);
            const thrust = wave(p, 0.51, 0.70);
            const scan = clamp((p - 0.02) / 0.50, 0, 1);
            const scanPower = wave(p, 0.02, 0.58);

            /* 全局量：字距、网格、显隐 */
            root.style.setProperty("--spread", close.toFixed(3));
            root.style.setProperty("--close", close.toFixed(3));
            root.style.setProperty("--intro", intro.toFixed(3));
            root.style.setProperty("--late", late.toFixed(3));

            parx += (tparx - parx) * 0.06;
            pary += (tpary - pary) * 0.06;
            rig.style.setProperty("--parx", parx.toFixed(2) + "px");
            rig.style.setProperty("--pary", pary.toFixed(2) + "px");

            /* 轴：收束时轻微缩短，刻度随扫描头依次亮起 */
            rail.style.transform = "scaleX(" + (0.92 - close * 0.06).toFixed(3) + ")";
            for (let i = 0; i < ticks.length; i++) {
                const near = Math.max(0, 1 - Math.abs(scan - i / TICKS) / 0.11);
                ticks[i].style.opacity = (0.35 + near * scanPower * 0.55).toFixed(3);
            }
            scanHead.style.left = (scan * 100).toFixed(2) + "%";
            scanHead.style.opacity = (scanPower * 0.62 * intro).toFixed(3);

            /* 点击脉冲：沿轴展开，900ms 内自行消失 */
            const pt = clamp((now - clickAt) / 900, 0, 1);
            pulse.style.setProperty("--pw", pt.toFixed(3));
            pulse.style.setProperty("--po", (Math.sin(Math.PI * pt) * 0.42).toFixed(3));

            /* 中央斜杠：与全场同拍推拉 + 微旋，5 秒后才出现 */
            slash.style.opacity = (late * 0.9).toFixed(3);
            slash.style.setProperty("--sx", (scan * 8 - 4 + thrust * 30 * 0.34).toFixed(2) + "px");
            slash.style.setProperty("--sy", (-thrust * 30 * 0.94).toFixed(2) + "px");
            slash.style.setProperty("--rot", (thrust * 4).toFixed(2) + "deg");

            /* 滑块：所有文字吃同一组量，按 lane 分配方向与幅度 */
            for (const u of units) {
                const dir = -Math.sign(u.lane);
                const prox = Math.max(0, 1 - Math.abs(u.pos - scan) / 0.14) * scanPower;
                const ux = close * Math.sign(u.lane) * 18
                         + shear * dir * (22 + Math.abs(u.lane) * 9)
                         + thrust * 30 * 0.34;
                const uy = close * (u.lane * 2)
                         + shear * (u.lane * 3)
                         - thrust * 30 * 0.94
                         - prox * 14
                         + (1 - intro) * 12
                         + (u.late ? (1 - late) * 10 : 0);
                u.ux = ux; u.uy = uy;
                /* 邮箱与 Limited 是严格对称的一对：同亮度、同字号、同物理 */
                u.o = u.late ? late : intro;
                u.visible = u.o > 0.01;
                u.el.style.setProperty("--ux", ux.toFixed(2) + "px");
                u.el.style.setProperty("--uy", uy.toFixed(2) + "px");
                u.el.style.setProperty("--o", u.o.toFixed(3));
            }

            /* 逐字磁场：LOGO / 邮箱 / Limited / 四字完全同一套物理 */
            const R = precise ? 230 : 175;
            const R2 = R * R;
            const active = onPoint && !reduceMotion;
            for (const g of glyphs) {
                let tx = 0, ty = 0, tr = 0, td = 0;
                if (active && g.unit.visible) {
                    const gx = g.cx + g.unit.ux + parx;
                    const gy = g.cy + g.unit.uy + pary;
                    const dx = gx - px, dy = gy - py;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < R2) {
                        const d = Math.sqrt(d2) || 0.001;
                        const f = 1 - d / R;
                        const k = f * f;
                        const nx = dx / d, ny = dy / d;
                        tx = nx * k * 17;
                        ty = ny * k * 17 - k * 4;
                        tr = -nx * k * 7;
                        td = k * 0.28;
                    }
                }
                g.x += (tx - g.x) * 0.16;
                g.y += (ty - g.y) * 0.16;
                g.r += (tr - g.r) * 0.16;
                g.d += (td - g.d) * 0.16;

                const moving = Math.abs(g.x - g.lx) > 0.02 || Math.abs(g.y - g.ly) > 0.02
                            || Math.abs(g.r - g.lr) > 0.02 || Math.abs(g.d - g.ld) > 0.002;
                if (moving) {
                    g.el.style.transform = "translate3d(" + g.x.toFixed(2) + "px," +
                        g.y.toFixed(2) + "px,0) rotate(" + g.r.toFixed(2) + "deg)";
                    g.el.style.setProperty("--ga", Math.min(1, g.base + g.d).toFixed(3));
                    g.lx = g.x; g.ly = g.y; g.lr = g.r; g.ld = g.d;
                }
            }

            requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
    })();
    </script>
